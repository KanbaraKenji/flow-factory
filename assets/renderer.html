<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__FLOW_TITLE__</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#eef1f6; --cvbg:#f6f8fb; --grid:rgba(60,80,110,.06); --solid:#ffffff; --well:#f1f4f8;
  --line:#e2e7ef; --line2:#cfd7e3; --tx:#18202c; --tx2:#4c5869; --tx3:#7d8899;
  --pri:#2f6fd6; --pri-h:#2459b3; --pri-t:#2459b3; --pri-tint:rgba(47,111,214,.10); --pri-line:rgba(47,111,214,.35); --on-pri:#fff;
  --ok:#2e9a5b; --warn:#c98a12; --warn-bg:#fdf4e1; --bad:#d2453f; --bad-bg:#fdecea; --info:#2f86c4;
  --shadow:0 6px 24px rgba(20,30,50,.10),0 1px 3px rgba(20,30,50,.06);
  --t-m:360ms; --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --cvbg:#131a23; --grid:rgba(200,215,235,.05); --solid:#1a222d; --well:#202a36;
  --line:#2a3542; --line2:#364454; --tx:#e7edf5; --tx2:#b2bdcb; --tx3:#8592a3;
  --pri:#5b9cff; --pri-h:#7db0ff; --pri-t:#8fbbff; --pri-tint:rgba(91,156,255,.14); --pri-line:rgba(91,156,255,.4); --on-pri:#0b1422;
  --ok:#4cc27c; --warn:#e3a93a; --warn-bg:#3a2f15; --bad:#f06b63; --bad-bg:#3d1d1c; --info:#62aee6;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --cvbg:#131a23; --grid:rgba(200,215,235,.05); --solid:#1a222d; --well:#202a36;
  --line:#2a3542; --line2:#364454; --tx:#e7edf5; --tx2:#b2bdcb; --tx3:#8592a3;
  --pri:#5b9cff; --pri-h:#7db0ff; --pri-t:#8fbbff; --pri-tint:rgba(91,156,255,.14); --pri-line:rgba(91,156,255,.4); --on-pri:#0b1422;
  --ok:#4cc27c; --warn:#e3a93a; --warn-bg:#3a2f15; --bad:#f06b63; --bad-bg:#3d1d1c; --info:#62aee6;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--font)}
button{font:inherit;color:inherit}
a{text-decoration:none;color:var(--pri-t)}
[hidden]{display:none!important}
.wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head h1{margin:0;font-size:20px}
.head .sub{color:var(--tx2);font-size:12.5px;margin-top:2px}
.hr{display:flex;gap:8px;align-items:center;margin-left:auto;position:relative}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--solid);color:var(--tx);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{border:0;background:none;color:var(--pri-t);cursor:pointer;padding:0;font-size:12.5px}
.lnk:hover{color:var(--pri-h)}
.bar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin:12px 0 10px}
.seg{display:inline-flex;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--solid);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.ttl{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap} .ttl h1{margin:0} .ttl .sub{margin:0}
/* 图例在画布左上角（左侧线路图右边），半透明底，不挡操作 */
.legend{position:absolute;right:10px;top:10px;z-index:6;max-width:calc(100% - 120px);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--tx2);background:color-mix(in srgb,var(--solid) 82%,transparent);border:1px solid var(--line);border-radius:10px;padding:4px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.legend:empty{display:none}
.legend [data-lg]{cursor:default;border-radius:6px;padding:0 3px;margin:0 -3px;transition:opacity .2s} .legend [data-lg].off{opacity:.4} .legend.can [data-lg]{cursor:pointer} .legend [data-lg]:hover{background:var(--pri-tint);color:var(--tx)}
.legend .hint{max-width:46ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cv:has(.side.open) .legend{right:calc(min(380px,100% - 40px) + 20px)}
@media (max-width:700px){.legend{right:8px;max-width:calc(100% - 16px);font-size:11.5px}}
.legend .sw{display:inline-block;width:14px;height:8px;border-radius:4px;margin-right:5px;vertical-align:1px;background:var(--line2)}
.legend .hint{color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}
.help{position:absolute;right:0;top:40px;z-index:40;width:min(380px,calc(100vw - 32px));background:var(--solid);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:12.5px}
.help ul{margin:6px 0 0;padding-left:18px;color:var(--tx2)} .help li{margin:3px 0}
/* 画布 */
.cv{position:relative;height:560px;min-height:380px;border:1px solid var(--line);border-radius:16px;background:var(--cvbg);overflow:hidden;touch-action:none;outline:none}
.cv:focus-visible{outline:2px solid var(--pri-t);outline-offset:2px}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#svg.drag{cursor:grabbing}
.bgrid{fill:none;stroke:var(--grid)}
/* 卡片 */
.card .bx{fill:var(--solid);stroke:var(--line2);stroke-width:1.3}
.card{cursor:pointer;transition:opacity var(--t-m) var(--ease)}
.card:hover .bx{stroke:var(--pri)}
.card.sel .bx{stroke:var(--pri);stroke-width:2.6}
.card.now .bx{stroke:var(--pri);stroke-width:2.2}
.card.k-hand .bx{stroke-dasharray:6 4}
.card .nm{font:700 16px var(--font);fill:var(--tx)}
.card .nm.s{font-size:14px}
.card .sb{font:12px var(--font);fill:var(--tx3)}
.card .ic{fill:none;stroke:var(--tx2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .tb{fill:var(--lc)}
.card.off{opacity:.42}
.act rect{fill:var(--well);stroke:var(--line)} .act text{font:600 11px var(--font);fill:var(--tx2)}
.pill rect{fill:var(--solid);stroke:var(--line2)} .pill text{font:600 11px var(--font);fill:var(--tx2)}
.pill.lv-ok rect{stroke:var(--line2)} .pill.lv-ok text{fill:var(--tx2)}
.pill.lv-risk rect{stroke:var(--warn);fill:var(--warn-bg)} .pill.lv-risk text{fill:var(--warn)}
.pill.lv-bad rect{stroke:var(--bad);fill:var(--bad)} .pill.lv-bad text{fill:var(--on-pri)}
.pill.k-retry rect{stroke:var(--info)} .pill.k-retry text{fill:var(--info)}
.pill.k-human rect{stroke:var(--warn)} .pill.k-human text{fill:var(--warn)}
.pill.k-degrade rect{stroke:var(--warn);stroke-dasharray:4 2} .pill.k-degrade text{fill:var(--warn)}
.pill.k-stop rect{stroke:var(--bad)} .pill.k-stop text{fill:var(--bad)}
.pill.k-stuck rect{stroke:var(--bad);fill:var(--bad)} .pill.k-stuck text{fill:var(--on-pri)}
.pill.k-none rect,.pill.lv-none rect{stroke-dasharray:3 3;stroke:var(--tx3)} .pill.k-none text{fill:var(--tx3)}
.pill.st rect{stroke:var(--info);stroke-dasharray:3 2} .pill.st text{fill:var(--info)}
.pill.st.rd rect{stroke:var(--tx3);stroke-dasharray:2 2} .pill.st.rd text{fill:var(--tx2)}
.pill.st.more rect{stroke:var(--line2);stroke-dasharray:none} .pill.st.more text{fill:var(--tx2)}
.irv rect{fill:var(--bad)} .irv.lv-ok rect{fill:var(--tx2)} .irv.lv-risk rect{fill:var(--warn)} .irv text{font:700 11px var(--font);fill:var(--on-pri)}
.prod .bx{fill:var(--solid);stroke:var(--ok);stroke-width:2}
.prod .nm{font:700 16px var(--font);fill:var(--tx)} .prod .sb{font:12px var(--font);fill:var(--tx2)} .prod .lb{font:600 11px var(--font);fill:var(--ok)}
.store .bx{fill:var(--well);stroke:var(--line2)} .store .nm{font:600 13px var(--font);fill:var(--tx)} .store .nm.s{font-size:12px} .store .sb{font:11.5px var(--font);fill:var(--tx3)}
.store.hit .bx{stroke:var(--info);stroke-width:2.4}
.zone{font:600 13px var(--font);fill:var(--tx3)}
/* 组（几方同时处理、都通过才往下）：淡底虚线框 + 标题；这件货跳过的那一方虚线卡、挂「跳过」，分到它的那一股带子变淡 */
.gbox{cursor:pointer} .gbox .gbg{fill:color-mix(in srgb,var(--lc) 5%,transparent);stroke:var(--lc);stroke-opacity:.45;stroke-width:1.3;stroke-dasharray:6 5}
.gbox:hover .gbg,.gbox.sel .gbg{stroke-opacity:.9;stroke-width:1.8}
.gbox .gl{font:600 13px var(--font);fill:var(--tx2)} .gbox .gl2{font:11.5px var(--font);fill:var(--tx3)}
.gbox .gl3{font:600 11px var(--font);fill:var(--tx3)} .gbox .gl3.w{font-weight:400;font-size:11.5px;fill:var(--tx2)}
.card.gskip .bx{stroke-dasharray:5 4;fill:var(--well)} .card.gskip .pmid,.card.gskip .pbot,.card.gskip .ic,.card.gskip .nm{opacity:.5}
.pill.gsk rect{fill:var(--well);stroke:var(--tx3);stroke-dasharray:3 2} .pill.gsk text{fill:var(--tx2)}
.lgs{opacity:.2} .tok.gcp{pointer-events:none}
:root[data-calm] .gbox .gbg{fill:none;stroke:var(--line2);stroke-opacity:1;stroke-width:1.2}
svg.lnhl #world .gbox:not(.lh){opacity:.22}
/* 带子：主线实带；岔路、退回平时很淡，当前货走到或指着那一站时才亮 */
.belt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.belt.main{stroke:var(--lc);stroke-opacity:.42;stroke-width:11}
.belt.mainc{stroke:var(--lc);stroke-width:2;stroke-dasharray:2 14;opacity:.85}
.belt.jump{stroke:var(--lc);stroke-width:3;stroke-dasharray:9 6}
.belt.back{stroke:var(--tx3);stroke-width:2.4;stroke-dasharray:3 6}
/* 带子一直在走：虚点 / 虚线沿行进方向流（系统设了减少动态效果就静止） */
.eg:is(.on,.nx) .belt.mainc{animation:bflow16 1.1s linear infinite} .eg:is(.on,.nx) .belt.jump{animation:bflow15 1.1s linear infinite} .eg:is(.on,.nx) .belt.back{animation:bflow9 1.1s linear infinite} .eg.ag:is(.on,.nx) .belt.back{animation:bflow11 1.1s linear infinite}
.belt.mainc,.belt.jump,.belt.back{animation-delay:var(--bt,0ms)}
@keyframes bflow16{to{stroke-dashoffset:-16}} @keyframes bflow15{to{stroke-dashoffset:-15}} @keyframes bflow9{to{stroke-dashoffset:-9}} @keyframes bflow11{to{stroke-dashoffset:-11}}
.arw{fill:var(--lc)} .arw.b{fill:var(--tx3)}
.eg{transition:opacity var(--t-m) var(--ease)}
.eg.j{opacity:.12}
.eg.j.on,.eg.j.hv{opacity:1}
.card.planned .bx{stroke-dasharray:1.5 4.5;stroke-linecap:round;stroke-width:2} #world.hide-plan .card.planned{opacity:.16} .legend [data-plan]{cursor:pointer;color:var(--tx2)} .legend [data-plan].on{color:var(--pri-t)}
.pill.pl rect{stroke:var(--warn);stroke-dasharray:3 2;fill:none} .pill.pl text{fill:var(--warn)}
.plb{font-size:11px;color:var(--warn);border:1px dashed currentColor;border-radius:8px;padding:0 5px;margin-left:6px}
.eg.j.eq{opacity:1} .eg.j.eq .belt.jump{stroke-dasharray:none}   /* 对等分岔（站上写 decide: true）：几条路平时一样亮，没有正常与例外之分 */
.eg.m.on .belt.main{stroke-opacity:.8}
.eg.m.hv .belt.main{stroke-opacity:.7}
svg.v-fault .eg{opacity:.3} svg.v-fault .eg.j{opacity:.08}
svg.v-write .eg{opacity:.35} svg.v-write .eg.j{opacity:.08}
.pipe{fill:none;stroke:var(--info);stroke-width:1.4;stroke-dasharray:4 5;opacity:.18}
.pipe.on{opacity:.95;stroke-width:2.4;stroke-dasharray:none}
.pipe.rd{stroke:var(--tx2);stroke-dasharray:1 5;stroke-linecap:round;stroke-width:2}
.pipe.peer{opacity:.75;stroke-width:2}
.pipe.rd.on{stroke-dasharray:1 5;stroke-width:3}
/* 货箱 */
.tok.ghost{pointer-events:none} #trl{pointer-events:none}
.tok rect{fill:var(--pri);stroke:var(--solid);stroke-width:2.5}
.tok text{font:700 13px var(--font);fill:var(--on-pri)}
.tok.end rect{fill:var(--tx2)} .tok.taint rect{fill:var(--warn)}
.tcap{font:600 13px var(--font);fill:var(--pri-t);paint-order:stroke;stroke:var(--cvbg);stroke-width:5px;stroke-linejoin:round}
.tcap.end{fill:var(--tx)}
.pk{fill:var(--info)}
.inr{cursor:pointer} .inr rect{fill:var(--pri-tint);stroke:var(--pri-line);stroke-width:1} .inr text{font:600 11px var(--font);fill:var(--pri-t)}
.inr.lv-risk rect{fill:var(--warn-bg);stroke:var(--warn)} .inr.lv-risk text{fill:var(--warn)} .inr.lv-risk path{stroke:var(--warn)}
.inr.lv-bad rect{fill:var(--bad-bg);stroke:var(--bad)} .inr.lv-bad text{fill:var(--bad)} .inr.lv-bad path{stroke:var(--bad)}
.inq .t-risk{color:var(--warn)} .inq .t-bad{color:var(--bad)}
.inr:hover rect{fill:var(--pri);stroke:var(--pri)} .inr:hover text{fill:var(--on-pri)} .inr:hover path{stroke:var(--on-pri)}
.crumb{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:8px;max-width:calc(100% - 20px);white-space:nowrap;background:var(--solid);border:1px solid var(--line2);border-radius:999px;box-shadow:var(--shadow);padding:4px 5px 4px 12px;font-size:12.5px}
.crumb .sep{color:var(--tx3)} .crumb b{font-weight:700} .crumb .btn{padding:3px 12px;font-size:12.5px;border-radius:999px}
.crumb .crs{border:0;background:transparent;padding:0 2px;color:var(--pri-t);cursor:pointer;font-size:12.5px;font-weight:600} .crumb .crs:hover{color:var(--pri)}
.crumb .crd{border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer} .crumb .crd:hover .dep rect{stroke-width:2}
.crumb .dep{width:18px;height:18px;flex:none} .crumb .dep rect{fill:none;stroke:var(--pri);stroke-width:1.3} .crumb .dep rect.on{fill:var(--pri)}
.cv.inbox .toast{top:56px}
@media (max-width:640px){.crumb .crs:not(.par),.crumb .sep:not(.par){display:none}}
/* 盒中盒：外层快照淡化留在四周，那张卡的边框是墙 */
#outer,#insnap{pointer-events:none}
/* 左上：演哪件货（样例货菜单 + 演练），下面接这件货的进度圆点 */
.railhd{position:absolute;left:10px;top:var(--rht,52px);z-index:7;display:flex;align-items:center;gap:1px;background:var(--solid);border:1px solid var(--line2);border-radius:10px;padding:2px;box-shadow:var(--shadow);max-width:calc(100% - 140px)}
.railhd .smp{height:26px;gap:6px;padding:0 8px 0 4px;border-radius:8px} .railhd .smp .nm{font-size:12px} .railhd .smp .st{font-size:11.5px}
.railhd .mini{width:20px;height:18px;border-radius:5px;font-size:11px} .railhd .ib{width:28px;height:26px;border-radius:8px} .railhd .ib svg{width:16px;height:16px}
.ibg{fill:var(--solid)} .iz{font:600 15px var(--font);fill:var(--tx3)}
.iwall{fill:none;stroke:var(--pri);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.ijamb{fill:none;stroke:var(--pri);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.iup{cursor:pointer} .iupb{fill:var(--solid);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke} .iup:hover .iupb{fill:var(--pri-tint);stroke:var(--pri-line)}
.iupi{fill:none;stroke:var(--tx2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} .iup:hover .iupi{stroke:var(--pri)}
.ient{font:600 12.5px var(--font);fill:var(--pri-t);paint-order:stroke;stroke:var(--solid);stroke-width:5px;stroke-linejoin:round}
.istub{fill:none;stroke:var(--tx3);stroke-width:2;stroke-dasharray:3 4} .istt{font:600 12.5px var(--font);fill:var(--tx2);paint-order:stroke;stroke:var(--cvbg);stroke-width:5px;stroke-linejoin:round}
.door{cursor:pointer} .door .hit{fill:transparent} .door:hover .hit{fill:var(--pri-tint)} .door .dl{font:600 12.5px var(--font);fill:var(--pri-t);paint-order:stroke;stroke:var(--solid);stroke-width:5px;stroke-linejoin:round}

.inq{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;margin:0 0 12px;border:1px dashed var(--pri-line);border-radius:10px;background:var(--pri-tint);font-size:12.5px;color:var(--tx)}
.inq .btn{flex:none}
.bo.inb{border-style:dashed;border-color:var(--pri-line);background:var(--pri-tint)}
.pill.fo rect{fill:var(--pri-tint);stroke:var(--pri-line)} .pill.fo text{fill:var(--pri-t)}
.mds{cursor:pointer} .md rect{fill:var(--well);stroke:var(--line2)} .md text{font:600 11px var(--font);fill:var(--tx2)} .md.on rect{fill:var(--pri);stroke:var(--pri)} .md.on text{fill:var(--on-pri)}
.evb rect{fill:var(--well);stroke:var(--line2)} .evb text{font:600 11px var(--font);fill:var(--tx2)}
.eg.mu .belt.main{stroke-width:15} .belt.mug{display:none} .belt.mus{stroke:var(--lc);stroke-opacity:.75;stroke-width:8;stroke-dasharray:3 13;stroke-linecap:butt;fill:none}
.eg:is(.on,.nx) .belt.mus{animation:bflow16 1.1s linear infinite;animation-delay:var(--bt,0ms)}
.eg.ag .belt.back{stroke:var(--pri);stroke-dasharray:6 5;stroke-width:2.2}
.tok .sk1,.tok .sk2{fill:var(--pri);opacity:.45;stroke:var(--solid);stroke-width:1.5} .tok .sk2{opacity:.25}
.tok .skn rect{fill:var(--tx)} .tok .skn text{font:700 10.5px var(--font);fill:var(--solid)}
.tcap.lp{font-weight:700;fill:var(--warn)}
.mtw{overflow-x:auto;margin:0 0 12px} .mt2{border-collapse:collapse;width:100%;font-size:12.5px} .mt2 th,.mt2 td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.mt2 thead th{font-weight:600} .mt2 tbody th{color:var(--tx3);font-weight:500;white-space:nowrap;width:1%} .mt2 .on{background:var(--pri-tint)}
.rtbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:8;width:min(620px,calc(100% - 20px));background:var(--solid);border:1px solid var(--pri-line);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px;font-size:12.5px}
.cv.inbox .rtbar{top:56px}
.cv:has(.rtbar:not([hidden])) .toast{top:auto;bottom:72px}
.rtbar .rth{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap} .rtbar .lnk{margin-left:auto} .rtbar .bad{color:var(--bad)}
.rth2{margin:6px 0 0;padding-left:20px;max-height:150px;overflow:auto;color:var(--tx2)} .rth2 li{margin:2px 0} .rth2 .w{color:var(--tx3);font-size:12px}
.cmpc{margin:6px 0 0;color:var(--tx2)}
.btn.tg.on{border-color:var(--pri);color:var(--pri-t);box-shadow:0 0 0 1px var(--pri) inset;font-weight:600}
.bar .btn{height:30px;font-size:12.5px}
svg.routing .eg:not(.rt){opacity:.06!important} .eg.rt{opacity:1!important} .eg.rt .belt{stroke:var(--pri)!important;stroke-opacity:1!important} .eg.m.rt .belt.main{stroke-width:13}
.card.rtc .bx{stroke:var(--pri);stroke-width:2.6}
.cmk{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px}

<script id="flow-data" type="application/json">__FLOW_DATA__</script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   flow-factory 渲染器 v0.4（schema flow-factory/0）
   一份 flow.json → 整齐网格的生产线流程图。首屏先看全图，随后镜头推到入口，
   一次演一件样例货（演完自动下一件），流程 / 写入 / 故障三个视图，面板以岔路为主体。
   不读运行记录（那是监控图的事）。
   ════════════════════════════════════════════════════════════════ */
const D=JSON.parse(document.getElementById('flow-data').textContent);
const $=s=>document.querySelector(s);
/* 叫法（vocab）：rule = 业务规则图；也可写对象逐词覆盖 {base:"rule", kind:{in:"提交"}, product, cargo, sample, branch, trigger}（11-27 用户：对外投影不该出现「货」「成品库」）。
   只改界面上的固定说法，不改作者写的数据：数据经 esc 时包一对私用区记号，写进页面前只替换记号外面的字，再去掉记号 */
const VOC=(()=>{ const v=D.vocab, o=v&&typeof v==='object'?v:{}, base=v==='rule'||o.base==='rule';
  const def=base?{product:'完成',cargo:'单子',sample:'样例',branch:'去向',trigger:'入口',kind:{in:'提交',step:'处理',check:'审核',gate:'检查',hand:'人工',ai:'AI',out:'结束'}}:{kind:{}};
  const r={base,kind:Object.assign({},def.kind,o.kind||{})}; ['product','cargo','sample','branch','trigger'].forEach(k=>{ const x=o[k]!=null?o[k]:def[k]; if(x) r[k]=String(x); });
  r.on=!!(r.product||r.cargo||r.sample||r.branch||r.trigger); return r; })();
const VW=[['成品库','product'],['样例货','sample'],['怎么触发','trigger'],['岔路','branch'],['货','cargo']].filter(([,k])=>VOC[k]);
const esc=s=>{ const t=String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); return VOC.on?''+t+'':t; };
function vocab(h){ if(!VOC.on||typeof h!=='string') return h; return h.split(/([^]*)/).map(seg=>seg.charCodeAt(0)===0xE000?seg.slice(1,-1):VW.reduce((x,[w,k])=>x.split(w).join(VOC[k]),seg)).join('').replace(/[]/g,''); }
if(VOC.on){ const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML'); Object.defineProperty(Element.prototype,'innerHTML',{get(){ return d.get.call(this); },set(h){ d.set.call(this,vocab(h)); },configurable:true});
  const ia=Element.prototype.insertAdjacentHTML; Element.prototype.insertAdjacentHTML=function(p,h){ return ia.call(this,p,vocab(h)); }; }
const NS='http://www.w3.org/2000/svg';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* 链接参数（11-26 用户：汇报时用链接直接打开到「配色 + 场景 + 演练」）。三种写法都认：?skin=report&drill=1　#skin=report&drill=1　#skin.report~drill~sample.s2（Artifact 链接只能用最后这种）。从链接来的设置只管这一次打开，不写进浏览器记忆 */
const URLP=(()=>{ const o={}, put=(k,v)=>{ if(k) o[String(k).toLowerCase()]=v==null||v===''?'1':String(v); };
  try{ new URLSearchParams(location.search).forEach((v,k)=>put(k,v)); }catch(e){}
  let h=''; try{ h=decodeURIComponent(location.hash.slice(1)); }catch(e){ h=location.hash.slice(1); }
  if(h.includes('=')){ try{ new URLSearchParams(h).forEach((v,k)=>put(k,v)); }catch(e){} } else if(h) h.split('~').forEach(t=>{ const i=t.indexOf('.'); if(i<0) put(t); else put(t.slice(0,i),t.slice(i+1)); });
  return o; })();
if(URLP.mode==='drill'&&!URLP.drill) URLP.drill='1';
const store={get(k){try{return JSON.parse(localStorage.getItem('ff:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('ff:'+k,JSON.stringify(v))}catch(e){}}};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const calm=()=>document.documentElement.hasAttribute('data-calm'); let calmWake=()=>{};
(function(){ let t=0; const wake=()=>{ const r=document.documentElement; r.classList.remove('idle'); clearTimeout(t); if(r.hasAttribute('data-calm')) t=setTimeout(()=>{ if(!document.querySelector('.smpop:not([hidden]),.side.open,.help:not([hidden])')) r.classList.add('idle'); },2500); };
  ['pointermove','pointerdown','keydown','wheel'].forEach(k=>addEventListener(k,wake,{passive:true})); calmWake=wake; wake(); })();   /* 汇报主题：鼠标停 2.5 秒控件淡出，截图干净 */   /* 汇报主题：装饰动效关掉，只留货沿带子走 */

/* ── 词典 ── */
const KIND=Object.assign({in:'入料',step:'加工',check:'检查',gate:'闸门',hand:'人工',ai:'AI',out:'出货'},VOC.kind);
const ENDK={done:'完成',wait:'等下一轮',blocked:'等人',returned:'退回',failed:'失败',stuck:'卡死',exit:'出站'};
const OUTV={r:[1,0],l:[-1,0],b:[0,1],t:[0,-1]};   /* 墙在哪一侧 → 朝墙外的方向 */
/* 叫法：vocab: "rule" = 业务规则图（用户 11-26：岔路是规则本身，不是出错）。同一套数据，故障视图改叫「关卡」，小标按货被拦到哪写，不显示关注等级 */
const RULE=VOC.base;
function ruleLab(b,sid){ const t=b.to||'next'; if(t==='back') return '回原站'; if(t==='again') return '下一轮再来'; if(t==='exit') return '出站';
  if(t==='end') return ({returned:'退回发起人',failed:'不能继续',done:'到此结束',wait:'停住等待',blocked:'停住等人',stuck:'卡住'})[(b.end||{}).kind]||'到此结束';
  if(t==='next') return '往下走'; sid=(typeof MEM!=='undefined'&&MEM[sid])||sid;   /* 会签组的一方：按组在线上的位置算前后 */
  const L=(D.lines||[]).find(x=>(x.stations||[]).includes(sid)); if(L&&L.stations.indexOf(t)>=0&&L.stations.indexOf(t)<L.stations.indexOf(sid)) return '退回修改';
  return S[t]?'转「'+S[t].name+'」':'往下走'; }
const FK={retry:'自动再试',human:'转人工',degrade:'带病放行',stop:'中止',stuck:'卡死',none:'未处理'};
const FORDER=['retry','human','degrade','stop','stuck'];
const LVL={ok:'不用管',risk:'有隐患',bad:'需要补'};
const LVN={ok:0,risk:1,bad:2};
const IRT={delete:'删除',overwrite:'覆盖',send:'外发'};
const STK={db:'数据库',kv:'键值',file:'文件',queue:'队列',api:'外部服务',log:'日志',notify:'通知'};
const PAL=['#3b7fd0','#20a090','#8e6bd8','#d0862b','#c2557a','#5a8f2e'];

/* ── 数据归一 ── */
/* 一层 = 整张图，或某一站的站内小流程。S / LINES / EDGES 等永远指当前这一层，进出站内时就地换内容 */
let LV={def:D,sid:null,path:'',parent:null,name:'',color:null,products:D.products||[],layout:D.layout,input:(D.summary&&D.summary.input)||'',output:(D.summary&&D.summary.output)||''};
const S={}, LINES=[], LINE_OF={}, PROD={}, EDGES=[];
const STORE={}; (D.stores||[]).forEach(t=>STORE[t.id]=t);
function loadLevel(){ const def=LV.def, par=LV.parent;
  for(const k in S) delete S[k];
  Object.entries(def.stations||{}).forEach(([id,s])=>{ s.id=id; if(Array.isArray(s.actor)){ s.actors=s.actor.filter(Boolean); s.actor=(s.actors[0]||'')+(s.actors.length>1?' +'+(s.actors.length-1):''); }   /* actor 可写数组：卡上写第一个加「+N」，面板列全 */
    s.branches=s.branches||[]; s.writes=s.writes||[]; s.reads=s.reads||[]; s.irs=!s.irreversible?[]:Array.isArray(s.irreversible)?s.irreversible:[s.irreversible];
    /* 站内的出口岔路接到底墙上对应的出口门（门在这一层当成品库节点建，id = x_<外面岔路 k>） */
    if(par) s.branches.forEach(b=>{ if(b.to==='exit'){ b.exitK=b.exit; b.to='x_'+((LV.exitMap&&LV.exitMap[b.exit])||b.exit).replace(/^x_/,''); } });
    S[id]=s; });
  loadGroups(def);
  LINES.length=0; (def.lines||[]).forEach((L,i)=>LINES.push(Object.assign({color:LV.color&&i===0?LV.color:PAL[i%PAL.length]},L)));
  for(const k in LINE_OF) delete LINE_OF[k]; LINES.forEach(L=>L.stations.forEach((id,i)=>{ LINE_OF[id]={L,i}; }));
  for(const k in PROD) delete PROD[k]; (LV.products||[]).forEach(p=>PROD[p.id]=p);
  buildEdges();
  /* 站内：外面每条进来的带子在墙上开一个入口，各画一段带子接到入口站 */
  if(LV.ins&&LV.ins.length){ const e0=entries()[0]; if(e0) LV.ins.forEach(z=>EDGES.push({a:z.id,b:e0,kind:'main',brs:[],entry:true})); } }
/* ── 会签组：几方同时处理、都通过才往下（2026-11-26）──
   组 id 在线里占一个位置；成员是完整的站，只属于组。页面里组是一个「虚站」S[组 id]（group 字段指着组），它的岔路由几方的岔路拼出来：
   all = 都通过；all~成员 = 跳过这个可选成员后都通过；成员:k = 这一方走了它那条不通过的岔路（几方同时不通过时按组里的顺序取第一个）。
   组写了 pass（都通过后按情况去不同地方，11-27）：都通过分成几条 all/首次、all~成员/首次……，去向按 pass 那一项；
   组自己的岔路（branches：整张单的去向，比如申请人撤回，不是哪一方的结论）用它自己的 k，带 gbr，排在最后。
   这样路线、演练、结局、寻路都把组当成一站，只有布局、带子、货的动画和面板认得它是几方 */

    if(st.view!=='metro'&&C()&&C().path.length){ try{ stopTok(); PROC=null; PROC_OUT=null; world.querySelectorAll('.card.proc,.prod.proc').forEach(g=>g.classList.remove('proc')); setBeat(st.beat,false); }catch(e){} } if(was==='metro'||st.view==='metro'){ st.userCam=true; fit(true); } return; }
  if(t.dataset.fcol){ st.fcol=t.dataset.fcol; store.set('fcol',st.fcol); renderSegs(); buildWorld(); if(st.tab==='station') renderSide(); return; }
  if(t.dataset.tab){ st.tab=t.dataset.tab; st.fb=null; renderSide(); return; }
  if(t.dataset.smt){ st.smTab=t.dataset.smt; renderSmp(); return; }
  if(t.dataset.play){ $('#smpPop').hidden=true; playFrom(t.dataset.play); return; }
  if(t.dataset.entry){ playFrom('drill',t.dataset.entry); return; }
  if(t.dataset.mode){ const [sid,m]=t.dataset.mode.split('|'); MODESEL[sid]=m; buildWorld(); renderSide(); return; }
  if(t.dataset.skin){ applySkin(t.dataset.skin,true); return; }
  if(t.id==='routeBtn'){ routeOn(!RT.on); return; } if(t.dataset.rtx){ routeOn(false); return; } if(t.dataset.rtgo){ routeSend(); return; }
  if(t.id==='cmpBtn'){ cmpOn(!CMP.on); return; } if(t.dataset.cmpx){ cmpOn(false); return; } if(t.dataset.cmpnext){ cmpNext(); return; }
  if(t.dataset.inner){ openInner(t.dataset.inner); return; }
  if(t.dataset.gm){ selectStation(t.dataset.gm,{frame:true}); return; }
  if(t.dataset.indrill){ enterInner(t.dataset.indrill,'drill'); return; }
  if(t.dataset.up){ exitUp(+t.dataset.up); return; }
  if(t.dataset.pick){ drillChoose(t.dataset.pick); return; }
  if(t.dataset.undo){ drillUndo(); return; }
  if(t.dataset.save){ drillSave(); return; }
  if(t.dataset.copy){ drillCopy(); return; }
  if(t.dataset.redrill){ playFrom('drill'); return; }
  if(t.dataset.exitdrill){ exitDrill(); return; }
  if(t.dataset.del){ SAVED=SAVED.filter(x=>x.id!==t.dataset.del); store.set(SAVED_KEY,SAVED); if(st.cur===t.dataset.del) playFrom(SAMPLES[0].id); renderSmp(); $('#smpPop').hidden=false; return; }
  if(t.dataset.ftk){ st.follow=!st.follow; renderStat(); if(st.follow) followTick(true); renderSide(); return; }
  if(t.dataset.open){ const k=t.dataset.open; const isOpen=t.getAttribute('aria-expanded')==='true'; if(isOpen){ st.open.delete(k); st.open.add('!'+k); } else { st.open.add(k); st.open.delete('!'+k); } renderSide(); return; }
  if(t.dataset.fb){ st.fb=st.fb&&st.fb.key===t.dataset.fb?null:{key:t.dataset.fb,v:null,note:'',out:''}; renderSide(); return; }
  if(t.dataset.fbv&&st.fb){ st.fb.v=t.dataset.fbv; st.fb.out=''; renderSide(); return; }
  if(t.dataset.fbx){ st.fb=null; renderSide(); return; }
  if(t.dataset.fbgo&&st.fb){ fbCopy(); return; }
  switch(t.id){
    case 'smpBtn': { const p=$('#smpPop'); p.hidden=!p.hidden; t.setAttribute('aria-expanded',!p.hidden); break; }
    case 'runBtn': st.timer?stop():start(); break;
    case 'stepBtn': stop(); if(st.beat<maxBeat()) setBeat(st.beat+1,true); break;
    case 'backBtn': if(st.cur==='drill') drillUndo(); else { stop(); setBeat(st.beat-1,false); } break;
    case 'resetBtn': playFrom(st.cur); break;
    case 'drillBtn': if(st.cur==='drill') exitDrill(); else playFrom('drill'); break;
    case 'soloBtn': setSolo(!st.solo); break;
    case 'spdBtn': spdPop($('#spdPop').hidden); break;
    case 'loopBtn': st.loop=!st.loop; store.set('loop',st.loop); renderStat(); break;
    case 'followBtn': st.follow=!st.follow; renderStat(); if(st.follow) followTick(true); if(st.tab==='cargo') renderSide(); break;
    case 'panelBtn': if($('#side').classList.contains('open')) closeSide(); else { renderSide(); openSide(); } break;
    case 'sideX': closeSide(); break;
    case 'helpBtn': { const h=$('#helpPop'); h.hidden=!h.hidden; t.setAttribute('aria-expanded',!h.hidden); break; }
    case 'themeBtn': { const p=$('#skinPop'); p.hidden=!p.hidden; t.setAttribute('aria-expanded',!p.hidden); break; }
  } });
document.addEventListener('keydown',e=>{ if(e.target.closest('input,textarea,select')) return;
  if(e.key===' '){ e.preventDefault(); st.timer?stop():start(); }
  else if(e.key==='0'&&!$('#board').hidden&&$('#board [data-indrill]')){ e.preventDefault(); $('#board [data-indrill]').click(); }
  else if(/^[1-9]$/.test(e.key)&&!$('#board').hidden){ const bs=[...document.querySelectorAll('#board [data-pick],#board [data-entry]')]; const b=bs[+e.key-1]; if(b){ e.preventDefault(); b.click(); } }
  else if(e.key==='['||e.key===']'){ const i=SPEEDS.indexOf(SPD)+(e.key===']'?1:-1); if(i>=0&&i<SPEEDS.length){ setSpeed(SPEEDS[i]); toast('播放速度 '+spdTxt(SPD)); } }
  else if(e.key===','){ if(st.cur==='drill') drillUndo(); else { stop(); setBeat(st.beat-1,false); } } else if(e.key==='.'){ stop(); if(st.beat<maxBeat()) setBeat(st.beat+1,true); }
  else if(e.key==='Escape'){ if(!$('#skinPop').hidden) $('#skinPop').hidden=true; else if(!$('#helpPop').hidden) $('#helpPop').hidden=true; else if(!$('#smpPop').hidden) $('#smpPop').hidden=true; else if(!$('#spdPop').hidden) spdPop(false); else if($('#side').classList.contains('open')) closeSide(); else if(LSTACK.length) exitInner({}); } });

/* ════════ 自检：结果只进控制台和 window.__selfcheck ════════ */
/* 汇报配色里当关卡上色的站：作者在站上写 highlight: true 就只认这些；没写时人工和检查站不过半就都上色，过半（业务流程图常见）就只给检查和闸门上色，免得满图都是颜色 */
function hlSet(){ if(hlSet.k===S) return hlSet.v; const ids=Object.keys(S).filter(id=>!S[id].group), own=ids.filter(id=>S[id].highlight);
  let v=own; if(!own.length){ const hc=ids.filter(id=>['hand','check'].includes(S[id].kind)); v=hc.length*2<=ids.length?hc:ids.filter(id=>['check','gate'].includes(S[id].kind)); }
  hlSet.k=S; hlSet.v=new Set(v); return hlSet.v; }
function selfCheck(){ const R=[], add=(n,pass,why)=>R.push({n,pass,why:why||''});
  const ids=Object.keys(N).filter(k=>!N[k].store&&!N[k].grp); const ov=[]; ids.forEach((a,i)=>ids.slice(i+1).forEach(b=>{ const A=N[a],B=N[b]; if(Math.abs(A.x-B.x)<(A.w+B.w)/2+6&&Math.abs(A.y-B.y)<(A.h+B.h)/2+6) ov.push(a+'×'+b); }));
  add('卡片互不重叠',!ov.length,ov.join('、'));
  const of=[]; document.querySelectorAll('#world .card,#world .prod').forEach(g=>{ const bx=g.querySelector('.bx').getBBox(); g.querySelectorAll('text').forEach(t=>{ if(!t.textContent.trim()) return; try{ const b=t.getBBox(); if(b.x+b.width>bx.x+bx.width-3||b.y+b.height>bx.y+bx.height) of.push((g.dataset.st||g.dataset.prod)+'：'+t.textContent.slice(0,10)); }catch(e){} }); });
  add('卡片里的文字都在框内',!of.length,of.join('、'));
  { const d=document.querySelector('.dock').getBoundingClientRect(); add('播放栏在首屏内',d.bottom<=innerHeight+1&&d.top>=0,Math.round(d.bottom)+' > '+innerHeight); }
  const lost=Object.keys(S).filter(id=>!N[id]); add('每站都画出来了',!lost.length,lost.join('、'));
  const np=EDGES.filter(e=>!e.pts).map(e=>e.a+'>'+e.b); add('每条带子都有路线',!np.length,np.join('、'));
  { const lim=CW+40, over=[]; GIVEN.forEach(c=>(c.path||[]).forEach(p=>{ if(p.form&&wrapN(p.form,13,lim,3).some(l=>txtW(l,13)>lim+1)) over.push(c.name+'@'+((S[p.st]||{}).name||p.st)); }));
    add('货的说明字放得下（卡下方 3 行内，不截断）',!over.length,over.slice(0,6).join('、')); }
  add('页面不横向滚动',document.documentElement.scrollWidth<=innerWidth+1,document.documentElement.scrollWidth+' > '+innerWidth);
  window.__selfcheck=R; document.documentElement.dataset.selfcheck=R.filter(x=>x.pass).length+'/'+R.length;
  try{ console.info('[自检] '+document.documentElement.dataset.selfcheck+(R.some(x=>!x.pass)?' 未通过：'+R.filter(x=>!x.pass).map(x=>x.n+'（'+x.why+'）').join('；'):' 全部通过')); }catch(e){} }

/* ════════ 启动：先看全图，约 1.4 秒后镜头推到入口，开演第一件 ════════ */
/* 配色：明室跟随系统，也可以固定浅 / 深；其余六套照洗版样机，固定一种观感 */
const SKINS=[
  {k:'auto',n:'明室',d:'默认：浅色亚克力，跟随系统深浅',c:['#eef1f6','#ffffff','#2f6fd6','#c98a12','#d2453f']},
  {k:'light',n:'明室 · 浅',d:'固定浅色',c:['#eef1f6','#ffffff','#2f6fd6','#c98a12','#d2453f']},
  {k:'dark',n:'明室 · 深',d:'固定深色',c:['#0f141b','#1a222d','#5b9cff','#e3a93a','#f06b63']},
  {k:'report',n:'汇报',d:'投影与截图用：白底高对比、细线箭头、无网格；只留货沿带子走，其余动效关掉',c:['#F3F4F6','#FFFFFF','#1F4E8C','#A35F00','#B42318']},
  {k:'blueprint',n:'蓝图',d:'工程图纸：蓝底白框，适合拿去给同事讲',c:['#0C3159','#0F3C6B','#FFFFFF','#FFD479','#FF948A']},
  {k:'dyson',n:'戴森球',d:'深空 HUD：青色描边',c:['#04070E','#0F1A2E','#38CFFF','#FFB547','#FF5C70']},
  {k:'factorio',n:'异星工厂',d:'工业车间：混凝土地板，橙色点缀',c:['#23211F','#42403D','#FFA200','#C9A11B','#E8563C']},
  {k:'oni',n:'缺氧',d:'殖民地卡通：粗黑描边，薄荷青配珊瑚',c:['#272B39','#464C65','#62D2C2','#F5C451','#F2716F']},
  {k:'harvest',n:'牧场物语',d:'田园出货：奶油底、木框、草地',c:['#D3ECFF','#FFFBF0','#5FA83E','#B5864C','#C9483A']},
  {k:'stone',n:'石纪元',d:'科学王国：石灰底、漫画墨线、科学绿',c:['#E6E3DC','#FBFAF6','#1FA846','#1B1B19','#D63A2E']}];
const sw5=c=>`<span class="sw5">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span>`;
function applySkin(k,announce,once){ const sk=SKINS.find(x=>x.k===k||x.n===k)||SKINS[0], r=document.documentElement;
  delete r.dataset.skin; delete r.dataset.theme;
  if(sk.k==='light'||sk.k==='dark') r.dataset.theme=sk.k; else if(sk.k!=='auto') r.dataset.skin=sk.k;
  const wasCalm=r.hasAttribute('data-calm'); r.toggleAttribute('data-calm',sk.k==='report'); calmWake();
  { const u=URLP.minimap, f=D.minimap; r.toggleAttribute('data-nomm',u!=null?u==='0':f!=null?f===false:sk.k==='report'); }
  if(!once) store.set('skin',sk.k); const b=$('#themeBtn'); if(b) b.innerHTML=`${sw5(sk.c)} 配色 · ${esc(sk.n)}`;
  const pop=$('#skinPop'); if(pop) pop.innerHTML=SKINS.map(x=>`<button type="button" class="skc${x.k===sk.k?' on':''}" data-skin="${x.k}">${sw5(x.c)}<b>${esc(x.n)}</b><span class="ck">${x.k===sk.k?'在用':''}</span><span class="d">${esc(x.d)}</span></button>`).join('');
  if(announce&&wasCalm!==(sk.k==='report')&&typeof N!=='undefined'&&Object.keys(N).length){ try{ stopTok(); PROC=null; PROC_OUT=null; world.querySelectorAll('.card.proc,.prod.proc').forEach(g=>g.classList.remove('proc')); setBeat(st.beat,false); }catch(e){} }
  if(announce){ toast('已换成「'+sk.n+'」配色'); if(typeof bgGrid==='function'&&N&&Object.keys(N).length) bgGrid(); } }
if(URLP.skin&&SKINS.some(x=>x.k===URLP.skin||x.n===URLP.skin)) applySkin(URLP.skin,false,true);
else if(D.skin&&SKINS.some(x=>x.k===D.skin)) applySkin(D.skin,false,true);   /* flow.json 写了 skin：交给别人的页面打开就是这个配色，不看对方浏览器记住的 */
else applySkin(store.get('skin')||(store.get('theme')==='dark'?'dark':store.get('theme')==='light'?'light':'auto'));
/* 叫法：页面里写死的界面文字（页签、按钮提示、配色说明）也换一遍；标题、副标题是作者的数据，下面才填，不换 */
if(VOC.on){ const tw=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('script,#flow-data,#world,#ttl,#sub')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}); let n; while(n=tw.nextNode()) n.textContent=vocab(n.textContent);
  document.querySelectorAll('[title],[aria-label]').forEach(e=>{ ['title','aria-label'].forEach(a=>{ if(e.hasAttribute(a)&&!e.closest('#world')) e.setAttribute(a,vocab(e.getAttribute(a))); }); }); }
document.title=D.title||document.title; $('#ttl').textContent=D.title||''; $('#sub').textContent=(D.page==='monitor'?'运行监控图 · ':'')+(D.subtitle||'');
$('#helpPop').innerHTML=`<b>怎么看这张图</b><ul>
  <li>一进来先看全图；随后镜头推到入口，演一件样例货，演完自动换下一件</li>
  <li>画面最左边一竖排圆点是这件货的路线：实心 = 已经过、带光圈 = 现在在这站、空心 = 还没到；鼠标指着看站名，点一下等于点那一站</li>
  <li>点一张站卡：右边出它的详情，镜头把它移到没被挡住的地方</li>
  <li>底部左边的菜单选演哪件：典型样例、深度优先列出的全部路线、你收藏的路线；准星按钮开关镜头跟随，拖动画面也会停止跟随</li>
  <li>演练（底部分叉图标）：货每到有岔路的站就停下，由你选往哪走（数字键也行），逗号键撤回上一步；走到头可以收藏这条路线，或复制成样例货贴回对话</li>
  <li>实带是正常顺序；岔出去的路平时很淡，货走到或鼠标指着那一站时才亮</li>
  <li>站卡右上角有「站内 ›」的：点它，镜头推进那张卡，看这一站自己怎么一步步做出结果。墙上的开口对着外面的带子：外面的带子从哪一点碰到这张卡，墙上那一点就开一个入口或出口；点出口、点盒子外面、按 Esc、缩小，或点盒子右上角「缩回去」的图标都能回到外面；右边详情栏打开时，盒子会让到栏的左边。播放到有站内的站时，卡下会浮出「看里面 · N 步」，货停一会儿等你：点了就进去看，并且记住，以后到这种站自动进去（进去后顶上有「以后不进」）</li>
  <li>淡色虚线框里竖排的几张卡是「几方同时处理」：货到这里分成几份同时进每一方，都通过才并回一件往下走；有一方退回，就只有那一份沿退回的路走。虚线卡、挂「跳过」的是这件货那一方不在；框底写「整张单」的是不归哪一方的去向（比如申请人撤回），货不分份，从框底出去；点框或框上的字看这个组的规则</li>
  <li>寻路：点「寻路」，再点两站，看货从一站到另一站要走哪条路、每一站走哪条岔路；可以派一件货沿着走一遍</li>
  <li>总览（两条线以上才有）：每条线画成一条地铁线，看整体结构；点一站回到流程图</li>
  <li>运行、对比上一版：只有这张图带了运行记录 / 上一版时才出现</li>
  <li>点站点看它的岔路；有出错的那几条点开能看到你会看到什么、AI 的判断和建议</li>
  <li>视图「写入」看每站往哪里写；「故障」里灰 = 不用管，黄 = 有隐患，红 = 需要补</li>
  <li>每条出错去向都有「反馈」，生成一段文字贴回和 AI 的对话</li>
  <li>快捷键：空格 播放 / 暂停，逗号 退一步，句号 走一步，[ ] 慢一档 / 快一档，Esc 关面板</li></ul>`;
if(D.compare&&(D.compare.items||[]).length) $('#cmpBtn').hidden=false;
document.documentElement.toggleAttribute('data-public',D.audience==='public'||URLP.audience==='public');
/* 链接参数里的视图、只演这条、哪件货 */
if(URLP.view&&VIEWS().some(([k])=>k===URLP.view)) st.view=URLP.view;
if(URLP.solo) st.solo=URLP.solo!=='0';
const URL_BAD=[];
if(URLP.sample){ const c=pool().find(x=>x.id===URLP.sample); if(c) st.cur=c.id; else URL_BAD.push('样例货「'+URLP.sample+'」'); }
if(URLP.view&&st.view!==URLP.view) URL_BAD.push('视图「'+URLP.view+'」');
if(URLP.skin&&!SKINS.some(x=>x.k===URLP.skin||x.n===URLP.skin)) URL_BAD.push('配色「'+URLP.skin+'」');
if(URLP.station&&!S[URLP.station]) URL_BAD.push('站「'+URLP.station+'」');
if(URLP.speed&&!SPEEDS.includes(+URLP.speed)) URL_BAD.push('速度「'+URLP.speed+'」');
renderSegs(); sizeCv(); chooseCols(); routeAll(); bgGrid();
if(C()){ const q=slotAt(0); TK.x=q.x; TK.y=q.y; }
renderSmp(); buildWorld(); drawToks(); renderStat(); renderSide();
requestAnimationFrame(()=>{ fit(false);
  if(URL_BAD.length) toast('链接参数没认出：'+URL_BAD.join('、')+'，按默认打开');
  const dr=URLP.drill&&URLP.drill!=='0'?URLP.drill:null, ent=dr&&entries().includes(dr)?dr:null;
  const go=()=>{ if(dr){ if(ent) playFrom('drill',ent); else playFrom('drill'); } else if(URLP.play!=='0'&&!st.userCam&&st.follow) playFrom(st.cur);
    if(URLP.station&&S[URLP.station]) setTimeout(()=>selectStation(URLP.station),dr||URLP.play==='0'?0:300); };
  if(C()||dr) st.next=setTimeout(go,reduce?0:1400); });
if(SPEEDS.includes(+URLP.speed)) setSpeed(+URLP.speed,true); else setSpeed(SPD); setTimeout(selfCheck,1200);
</script>
